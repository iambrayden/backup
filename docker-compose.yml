version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backup}
      POSTGRES_DB: ${POSTGRES_DB:-backup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://backup:backup@postgres:5432/backup?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MASTER_KEY: ${MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      HTTP_ADDR: :8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@waylontech.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      DEFAULT_STORAGE_ENDPOINT: ${DEFAULT_STORAGE_ENDPOINT:-http://minio:9000}
      DEFAULT_STORAGE_BUCKET: ${DEFAULT_STORAGE_BUCKET:-backup}
      DEFAULT_STORAGE_REGION: ${DEFAULT_STORAGE_REGION:-us-east-1}
      DEFAULT_STORAGE_ACCESS_KEY: ${DEFAULT_STORAGE_ACCESS_KEY:-minioadmin}
      DEFAULT_STORAGE_SECRET_KEY: ${DEFAULT_STORAGE_SECRET_KEY:-minioadmin}
      DEFAULT_STORAGE_PATH_STYLE: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
